[project]
name = "iris-ndwi"
version = "0.1.0"
description = "IRIS-SAT-NDWI: Sentinel-2 green/NIR NDWI monitoring for peatland parcels (Wurzacher Ried)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "geoalchemy2==0.17.1",
    "numpy==2.2.3",
    "psycopg[binary]==3.2.5",
    "pydantic==2.10.6",
    "pyproj==3.7.1",
    "pystac-client==0.8.6",
    "pyyaml==6.0.2",
    "rasterio==1.5.1",
    "shapely==2.0.7",
    "sqlalchemy==2.0.38",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]
ui = [
    "folium==0.19.4",
    "pandas==2.2.3",
    "plotly==6.0.0",
    "streamlit==1.42.2",
    "streamlit-folium==0.24.0",
]

[project.scripts]
iris-ndwi = "iris_ndwi.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_ndwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostGIS (IRIS_TEST_DATABASE_URL) or network access",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # see the note in src/iris_ndwi/zonal.py
    "ignore::rasterio.errors.NotGeoreferencedWarning",
]
